<text x="24" y="638" font-size="13" fill="#57606a">Fluidez normal a quente (p50, 3–10 ms) não mudou: já estava abaixo da meta de 16,7 ms. Medido em 1920x1200; 3440x1440 ainda não medido.</text>
<text x="24" y="658" font-size="13" fill="#cf222e">Em aberto: travada de ~0,9 s em ~70% das primeiras sessões (correção pronta, sem medição limpa ainda).</text>
