<text x="24" y="38" font-size="22" font-weight="700" fill="#1b1f24">Geteco — desempenho: antes × depois (21–25/10)</text>
<text x="24" y="64" font-size="13" fill="#57606a">Barra cinza = antes (100%). Barra verde = depois, na mesma escala. Cada linha compara as duas versões medidas na mesma rodada da bancada.</text>
