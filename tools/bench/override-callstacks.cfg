; Export de diagnóstico: pilha de GDScript nos erros do release (auditoria 19/10, §3 item 10).
; Sem isto, o Logger (SessionDiagnostics.cs) recebe backtraces vazios no export_release.
; Não dá para ligar por variável de ambiente: o GDScriptLanguage lê a opção UMA vez, no construtor
; (GLOBAL_DEF_RST), antes de qualquer script rodar. O jeito sem recompilar é um override.cfg ao
; lado do GetecoV2.exe, lido na partida.
; Uso: GETECO_TRACK_CALL_STACKS=1 tools/perf_cross_bench.sh ... copia este arquivo para a pasta do
; export; sem a variável, a bancada afasta a cópia (override.cfg.callstacks-off). Para A/B do custo,
; use duas pastas do MESMO export, uma com e outra sem (ver docs/HOW-TO-DEVELOP.md §2).

[debug]

settings/gdscript/always_track_call_stacks=true
