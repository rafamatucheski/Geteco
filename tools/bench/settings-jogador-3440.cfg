; Opções gráficas do jogador na partida de 21/10/2026 (user://settings.cfg dele naquele dia), para a
; bancada medir o que ele vê: tela cheia no monitor ultrawide 3440x1440, sombras/distância/reflexo/
; detalhe altos, SSAO e névoa volumétrica ligados, MSAA 2x (valor 1 do menu), anisotropia 16x.
; Uso: BENCH_SETTINGS=tools/bench/settings-jogador-3440.cfg tools/perf_cross_bench.sh <export> <rótulo>
; Tela cheia ocupa o monitor durante a rodada. V-sync e limite ficam como o jogador deixou, mas o
; ReleaseBenchmark desliga os dois de qualquer jeito (Engine.max_fps = 0).
; Variante em janela 1920x1080 com as mesmas opções: settings-jogador-1080.cfg.

[audio]

master_volume=0.8
music_volume=0.8
sfx_volume=1.0
ambient_volume=1.0
mute_unfocused=false
voice_language="pt_BR"

[interface]

text_language="pt_BR"

[display]

window_mode=1
fullscreen=true
resolution=4
vsync=false
msaa=1
render_scale=1.0
fps_limit=3
shadow_quality=2
brightness=1.0
show_fps=false
camera_view=1

[graphics]

aa_mode=0
upscale_mode=1
shadow_distance=2
anisotropy=4
reflection_quality=2
detail_quality=2
ssao=true
volumetric_fog=true
glow=true
glow_strength=1.0
