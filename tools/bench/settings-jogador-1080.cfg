; Mesmas opções gráficas do jogador de 21/10/2026 (settings-jogador-3440.cfg), mas em janela de
; 1920x1080 (RESOLUTIONS[2]): mede quanto da diferença vem só da resolução (3440x1440 tem 2,4x os pixels).

[audio]

master_volume=0.8
music_volume=0.8
sfx_volume=1.0
ambient_volume=1.0
mute_unfocused=false
voice_language="pt_BR"

[interface]

text_language="pt_BR"

[display]

window_mode=0
fullscreen=false
resolution=2
vsync=false
msaa=1
render_scale=1.0
fps_limit=3
shadow_quality=2
brightness=1.0
show_fps=false
camera_view=1

[graphics]

aa_mode=0
upscale_mode=1
shadow_distance=2
anisotropy=4
reflection_quality=2
detail_quality=2
ssao=true
volumetric_fog=true
glow=true
glow_strength=1.0
