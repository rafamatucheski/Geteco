; Opções fixas da bancada de desempenho (tools/perf_cross_bench.sh e perf_cross_phase2.sh).
; Por que existe: sem --isolated-save-root o benchmark lia o user://settings.cfg do jogador, que
; mudou em 19/10 (SSAO, névoa volumétrica, render_scale 0,95, MSAA 4x, sombra alta, tela cheia
; ultrawide) e rodadas antes/depois deixaram de medir o mesmo jogo (auditoria 19/10, §1).
; A bancada copia este arquivo para a pasta isolada antes de CADA rodada, então nada que o jogo
; grave lá vaza para a rodada seguinte.
;
; Gráficos = preset "Média" (GraphicsOptions.PRESETS[1]); MSAA 2x é o valor 1 do menu.
; Janela de 1280x720 (RESOLUTIONS[0]) em modo janela: é a resolução que os relatórios citam e
; não depende do monitor. V-sync e limite de FPS ficam desligados aqui porque o ReleaseBenchmark
; os desliga de qualquer jeito (Engine.max_fps = 0); gravá-los igual evita leitura enganosa.
; O renderizador NÃO é escolhido aqui: vem do project.godot do export (Forward+ desde d8969407)
; ou de ENGINE_EXTRA="--rendering-method ..." na bancada; o JSON registra o que rodou.

[audio]

master_volume=0.8
music_volume=0.8
sfx_volume=1.0
ambient_volume=1.0
mute_unfocused=false
voice_language="pt_BR"

[interface]

text_language="pt_BR"

[display]

window_mode=0
fullscreen=false
resolution=0
vsync=false
msaa=1
render_scale=1.0
fps_limit=4
shadow_quality=1
brightness=1.0
show_fps=false
camera_view=1

[graphics]

aa_mode=0
upscale_mode=1
shadow_distance=1
anisotropy=3
reflection_quality=1
detail_quality=1
ssao=false
volumetric_fog=false
glow=true
glow_strength=0.75
